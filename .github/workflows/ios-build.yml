name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      run_simulator_tests:
        description: Run the iPhone Simulator test job (adds about 9 minutes)
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS app
    runs-on: xcode-27

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache Swift package data
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/SourcePackages
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Print build environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          xcode-select -p

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Compile app and widget for a generic iOS device
        run: |
          set -o pipefail
          xcodebuild \
            -project PocketLedger.xcodeproj \
            -scheme PocketLedger \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$HOME/Library/Developer/Xcode/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Archive iOS app
        run: |
          set -euo pipefail
          tar -czf "$GITHUB_WORKSPACE/PocketLedger-app.tar.gz" \
            -C "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" \
            PocketLedger.app

      - name: Upload iOS app
        uses: actions/upload-artifact@v7
        with:
          name: PocketLedger-ios-build
          path: PocketLedger-app.tar.gz
          retention-days: 1

  build-watch:
    name: Build watch app
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache Swift package data
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/SourcePackages
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Compile watch simulator and device builds
        run: |
          set -u
          simulator_log="$RUNNER_TEMP/xcodebuild-watch.log"
          device_log="$RUNNER_TEMP/xcodebuild-watch-device.log"

          xcodebuild \
            -project PocketLedger.xcodeproj \
            -scheme PocketLedgerWatch \
            -configuration Debug \
            -sdk watchsimulator \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/WatchDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/WatchSimulatorSourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build > "$simulator_log" 2>&1 &
          simulator_pid=$!

          xcodebuild \
            -project PocketLedger.xcodeproj \
            -scheme PocketLedgerWatch \
            -configuration Release \
            -sdk watchos \
            -destination "generic/platform=watchOS" \
            -derivedDataPath "$RUNNER_TEMP/WatchDeviceDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/WatchDeviceSourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build > "$device_log" 2>&1 &
          device_pid=$!

          simulator_status=0
          device_status=0
          wait "$simulator_pid" || simulator_status=$?
          wait "$device_pid" || device_status=$?

          cat "$simulator_log"
          cat "$device_log"

          if [ "$simulator_status" -ne 0 ]; then
            exit "$simulator_status"
          fi
          exit "$device_status"

      - name: Archive watch app
        run: |
          set -euo pipefail
          tar -czf "$GITHUB_WORKSPACE/PocketLedger-watch.tar.gz" \
            -C "$RUNNER_TEMP/WatchDeviceDerivedData/Build/Products/Release-watchos" \
            PocketLedgerWatch.app

      - name: Upload watch app
        uses: actions/upload-artifact@v7
        with:
          name: PocketLedger-watch-build
          path: PocketLedger-watch.tar.gz
          retention-days: 1

  test-ios:
    name: Run iOS tests
    runs-on: xcode-27
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_simulator_tests }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache Swift package data
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/SourcePackages
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Compile unit tests and boot an iPhone simulator
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && $2 ~ /^[A-Fa-f0-9-]+$/ { print $2; exit }')"
          test -n "$SIMULATOR_ID" || { echo "No available iPhone simulator found"; exit 1; }
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

          if ! xcrun simctl list devices available | grep -F "$SIMULATOR_ID" | grep -F "(Booted)" > /dev/null; then
            xcrun simctl boot "$SIMULATOR_ID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_ID" -b > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &
          simulator_boot_pid=$!

          build_status=0
          xcodebuild \
            -project PocketLedger.xcodeproj \
            -scheme PocketLedger \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -clonedSourcePackagesDirPath "$HOME/Library/Developer/Xcode/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/xcodebuild-tests.log" || build_status=$?

          if [ "$build_status" -ne 0 ]; then
            kill "$simulator_boot_pid" 2>/dev/null || true
            exit "$build_status"
          fi

          simulator_boot_status=0
          wait "$simulator_boot_pid" || simulator_boot_status=$?
          cat "$RUNNER_TEMP/simulator-boot.log"
          exit "$simulator_boot_status"

      - name: Run logic tests
        run: |
          set -euo pipefail
          test -n "$SIMULATOR_ID" || { echo "The test simulator was not selected"; exit 1; }
          xcodebuild \
            -project PocketLedger.xcodeproj \
            -scheme PocketLedger \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -clonedSourcePackagesDirPath "$HOME/Library/Developer/Xcode/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            test-without-building \
            -only-testing:PocketLedgerTests 2>&1 | tee "$RUNNER_TEMP/xcodebuild-logic-tests.log"

  package:
    name: Package unsigned IPA
    needs: [build-ios, build-watch, test-ios]
    if: ${{ always() && needs.build-ios.result == 'success' && needs.build-watch.result == 'success' && (needs.test-ios.result == 'success' || needs.test-ios.result == 'skipped') }}
    runs-on: xcode-27

    steps:
      - name: Download iOS app
        uses: actions/download-artifact@v7
        with:
          name: PocketLedger-ios-build
          path: ios-build

      - name: Download watch app
        uses: actions/download-artifact@v7
        with:
          name: PocketLedger-watch-build
          path: watch-build

      - name: Embed watch app and verify bundle
        run: |
          set -euo pipefail
          PACKAGE_ROOT="$RUNNER_TEMP/package"
          mkdir -p "$PACKAGE_ROOT"
          tar -xzf ios-build/PocketLedger-app.tar.gz -C "$PACKAGE_ROOT"
          tar -xzf watch-build/PocketLedger-watch.tar.gz -C "$PACKAGE_ROOT"

          APP_PATH="$PACKAGE_ROOT/PocketLedger.app"
          WATCH_SOURCE_PATH="$PACKAGE_ROOT/PocketLedgerWatch.app"
          test -d "$APP_PATH" || { echo "Missing iOS app: $APP_PATH"; exit 1; }
          test -d "$WATCH_SOURCE_PATH" || { echo "Missing watch app: $WATCH_SOURCE_PATH"; exit 1; }
          test -d "$APP_PATH/PlugIns" || { echo "Missing PlugIns directory: $APP_PATH/PlugIns"; exit 1; }
          WATCH_APP_PATH="$APP_PATH/PlugIns/PocketLedgerWatch.app"
          ditto "$WATCH_SOURCE_PATH" "$WATCH_APP_PATH"
          test -d "$WATCH_APP_PATH" || { echo "Missing embedded watch app: $WATCH_APP_PATH"; exit 1; }
          test ! -e "$APP_PATH/Watch/PocketLedgerWatch.app" || {
            echo "Single-target watch app was embedded in the legacy Watch directory."
            exit 1
          }
          test -d "$WATCH_APP_PATH/PlugIns/PocketLedgerWatchWidget.appex" || {
            echo "Missing embedded watch complication: $WATCH_APP_PATH/PlugIns/PocketLedgerWatchWidget.appex"
            exit 1
          }
          WIDGET_PATH=""
          for candidate in "$APP_PATH"/PlugIns/*.appex; do
            if [ -d "$candidate" ]; then
              WIDGET_PATH="$candidate"
              break
            fi
          done
          test -n "$WIDGET_PATH" || { echo "No WidgetKit .appex found in $APP_PATH/PlugIns"; exit 1; }
          test -f "$APP_PATH/Assets.car" || { echo "Missing compiled asset catalog: $APP_PATH/Assets.car"; exit 1; }
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")"
          test "$DISPLAY_NAME" = "Pocket Ledger" || {
            echo "Unexpected app display name: $DISPLAY_NAME"
            exit 1
          }
          echo "App: $APP_PATH"
          echo "Watch app: $WATCH_APP_PATH"
          echo "Widget extension: $WIDGET_PATH"
          echo "Compiled asset catalog: $APP_PATH/Assets.car"
          echo "Display name: $DISPLAY_NAME"
          file "$APP_PATH/PocketLedger"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/package/PocketLedger.app"
          PACKAGE_ROOT="$RUNNER_TEMP/unsigned-ipa"
          IPA_PATH="$GITHUB_WORKSPACE/PocketLedger-unsigned.ipa"
          rm -rf "$PACKAGE_ROOT"
          rm -f "$IPA_PATH"
          mkdir -p "$PACKAGE_ROOT/Payload"
          ditto "$APP_PATH" "$PACKAGE_ROOT/Payload/PocketLedger.app"
          ditto -c -k --sequesterRsrc --keepParent "$PACKAGE_ROOT/Payload" "$IPA_PATH"
          test -f "$IPA_PATH"
          unzip -t "$IPA_PATH"
          unzip -Z1 "$IPA_PATH" | grep -Eq '^Payload/PocketLedger\.app/PlugIns/[^/]+\.appex(/|$)' || {
            echo "Packaged IPA does not contain an embedded widget extension."
            exit 1
          }
          unzip -Z1 "$IPA_PATH" | grep -Eq '^Payload/PocketLedger\.app/PlugIns/PocketLedgerWatch\.app/Info\.plist$' || {
            echo "Packaged IPA does not contain the single-target watch app in PlugIns."
            exit 1
          }
          if unzip -Z1 "$IPA_PATH" | grep -Eq '^Payload/PocketLedger\.app/Watch/PocketLedgerWatch\.app(/|$)'; then
            echo "Packaged IPA contains the watch app at the legacy Watch path."
            exit 1
          fi
          unzip -l "$IPA_PATH"

      - name: Package iPhone sideload IPA
        run: |
          set -euo pipefail
          SIDELOAD_ROOT="$RUNNER_TEMP/iphone-sideload"
          SIDELOAD_IPA="$GITHUB_WORKSPACE/PocketLedger-iphone-sideload.ipa"
          mkdir -p "$SIDELOAD_ROOT/Payload"
          ditto "$RUNNER_TEMP/package/PocketLedger.app" "$SIDELOAD_ROOT/Payload/PocketLedger.app"
          # Omit watchOS binaries from the iPhone package used by Sideloadly.
          rm -rf "$SIDELOAD_ROOT/Payload/PocketLedger.app/PlugIns/PocketLedgerWatch.app"
          ditto -c -k --sequesterRsrc --keepParent "$SIDELOAD_ROOT/Payload" "$SIDELOAD_IPA"
          unzip -t "$SIDELOAD_IPA"
          unzip -Z1 "$SIDELOAD_IPA" | grep -Eq '^Payload/PocketLedger\.app/PlugIns/PocketLedgerWidget\.appex/Info\.plist$' || {
            echo "Sideload IPA is missing the iOS widget."
            exit 1
          }
          if unzip -Z1 "$SIDELOAD_IPA" | grep -Eq '^Payload/PocketLedger\.app/(PlugIns|Watch)/PocketLedgerWatch\.app(/|$)'; then
            echo "Sideload IPA still contains the Watch companion."
            exit 1
          fi

      - name: Write build information
        run: |
          set -euo pipefail
          {
            echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "Swift: $(swift --version | head -n 1)"
            echo "Commit: $GITHUB_SHA"
            echo "Build date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-info.txt
          cat build-info.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: PocketLedger-unsigned
          path: |
            PocketLedger-unsigned.ipa
            build-info.txt
          retention-days: 7

      - name: Upload iPhone sideload IPA
        uses: actions/upload-artifact@v7
        with:
          name: PocketLedger-iphone-sideload
          path: |
            PocketLedger-iphone-sideload.ipa
            build-info.txt
          retention-days: 7
