name: Build unsigned iOS IPAs

on:
  workflow_dispatch:
    inputs:
      run_simulator_tests:
        description: Run the iPhone Simulator test job (adds about 9 minutes)
        required: false
        default: false
        type: boolean
      include_sandbox:
        description: Build and package the sandbox iPhone app
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-package:
    name: Build selected iPhone IPA variants
    needs: test-ios
    if: always() && (needs.test-ios.result == 'success' || needs.test-ios.result == 'skipped')
    runs-on: xcode-27

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache Swift package data
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/SourcePackages
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Select Xcode 27.3 beta
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.3_beta.app/Contents/Developer
          xcodebuild -version

      - name: Print build environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          xcode-select -p

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build normal iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project PocketLedger.xcodeproj \
            -scheme PocketLedger \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/NormalDerivedData" \
            -clonedSourcePackagesDirPath "$HOME/Library/Developer/Xcode/SourcePackages" \
            POCKET_LEDGER_DEVELOPER_PRO_OVERRIDE=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-normal.log"

      - name: Build sandbox iPhone app
        if: ${{ inputs.include_sandbox }}
        run: |
          set -o pipefail
          xcodebuild \
            -project PocketLedger.xcodeproj \
            -scheme PocketLedger \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/SandboxDerivedData" \
            -clonedSourcePackagesDirPath "$HOME/Library/Developer/Xcode/SourcePackages" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIconSandbox \
            POCKET_LEDGER_DEVELOPER_PRO_OVERRIDE=YES \
            POCKET_LEDGER_BUNDLE_ID_SUFFIX=.sandbox \
            POCKET_LEDGER_APP_GROUP_ID_SUFFIX=.sandbox \
            POCKET_LEDGER_DISPLAY_NAME="Pocket Ledger Sandbox" \
            POCKET_LEDGER_URL_SUFFIX=-sandbox \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-sandbox.log"

      - name: Package and verify selected iPhone app IPAs
        env:
          INCLUDE_SANDBOX: ${{ inputs.include_sandbox }}
        run: |
          set -euo pipefail

          check_plist_value() {
            local plist="$1"
            local key="$2"
            local expected="$3"
            local actual
            actual=$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist")
            if [ "$actual" != "$expected" ]; then
              echo "Unexpected $key in $plist: $actual (expected $expected)"
              return 1
            fi
          }

          require_entry() {
            local entries="$1"
            local entry="$2"
            grep -Fxq "$entry" "$entries" || {
              echo "IPA is missing $entry"
              return 1
            }
          }

          package_ipa() {
            local variant="$1"
            local source_app="$2"
            local app_bundle_id="$3"
            local app_display_name="$4"
            local ipa_name="$5"
            local app_group_id="group.$app_bundle_id"
            local package_root="$RUNNER_TEMP/package-$variant"
            local app_path="$package_root/Payload/PocketLedger.app"
            local ipa_path="$GITHUB_WORKSPACE/$ipa_name"
            local entries="$RUNNER_TEMP/$variant-ipa-entries.txt"

            test -d "$source_app" || { echo "Missing $variant iPhone app"; return 1; }
            mkdir -p "$package_root/Payload"
            ditto "$source_app" "$app_path"

            check_plist_value "$app_path/Info.plist" CFBundleIdentifier "$app_bundle_id"
            check_plist_value "$app_path/Info.plist" CFBundleDisplayName "$app_display_name"
            check_plist_value "$app_path/Info.plist" PocketLedgerDeveloperProOverrideEnabled YES
            check_plist_value "$app_path/Info.plist" PocketLedgerAppGroupIdentifier "$app_group_id"
            check_plist_value "$app_path/Info.plist" CFBundleVersion "$GITHUB_RUN_NUMBER"

            local executable
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")
            echo "Preparing $variant signature: $app_path"
            xcrun lipo -archs "$app_path/$executable"
            if ! codesign --display "$app_path" 2>&1; then
              echo "No existing signature in $variant/$executable"
            fi
            codesign --force --sign - --timestamp=none "$app_path"
            codesign --verify --strict "$app_path"

            ditto -c -k --sequesterRsrc --keepParent "$package_root/Payload" "$ipa_path"
            unzip -t "$ipa_path"
            unzip -Z1 "$ipa_path" > "$entries"
            require_entry "$entries" Payload/PocketLedger.app/Info.plist
            if grep -Eq '^Payload/PocketLedger\.app/(PlugIns|Watch)/' "$entries"; then
              echo "The iPhone app IPA must not contain extensions or a Watch app."
              return 1
            fi
            echo "Verified $ipa_name ($app_bundle_id; app only)"
          }

          package_ipa normal \
            "$RUNNER_TEMP/NormalDerivedData/Build/Products/Release-iphoneos/PocketLedger.app" \
            "com.josephlteif.pocketledger" \
            "Pocket Ledger" \
            "PocketLedger-normal-build-$GITHUB_RUN_NUMBER.ipa"
          if [[ "$INCLUDE_SANDBOX" == "true" ]]; then
            package_ipa sandbox \
              "$RUNNER_TEMP/SandboxDerivedData/Build/Products/Release-iphoneos/PocketLedger.app" \
              "com.josephlteif.pocketledger.sandbox" \
              "Pocket Ledger Sandbox" \
              "PocketLedger-sandbox-build-$GITHUB_RUN_NUMBER.ipa"
          fi

          expected_ipa_count=1
          if [[ "$INCLUDE_SANDBOX" == "true" ]]; then
            expected_ipa_count=2
          fi
          actual_ipa_count="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name 'PocketLedger-*-build-*.ipa' -type f | wc -l | tr -d '[:space:]')"
          test "$actual_ipa_count" = "$expected_ipa_count"

      - name: Upload IPA files
        uses: actions/upload-artifact@v7
        with:
          name: PocketLedger-build-${{ github.run_number }}
          path: |
            PocketLedger-*-build-*.ipa
          if-no-files-found: error
          retention-days: 7
  test-ios:
    name: Run iOS tests
    runs-on: xcode-27
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_simulator_tests }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache Swift package data
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/SourcePackages
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Select Xcode 27.3 beta
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.3_beta.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Compile unit tests and boot an iPhone simulator
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && $2 ~ /^[A-Fa-f0-9-]+$/ { print $2; exit }')"
          test -n "$SIMULATOR_ID" || { echo "No available iPhone simulator found"; exit 1; }
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

          if ! xcrun simctl list devices available | grep -F "$SIMULATOR_ID" | grep -F "(Booted)" > /dev/null; then
            xcrun simctl boot "$SIMULATOR_ID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_ID" -b > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &
          simulator_boot_pid=$!

          build_status=0
          xcodebuild \
            -project PocketLedger.xcodeproj \
            -scheme PocketLedger \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -clonedSourcePackagesDirPath "$HOME/Library/Developer/Xcode/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/xcodebuild-tests.log" || build_status=$?

          if [ "$build_status" -ne 0 ]; then
            kill "$simulator_boot_pid" 2>/dev/null || true
            exit "$build_status"
          fi

          simulator_boot_status=0
          wait "$simulator_boot_pid" || simulator_boot_status=$?
          cat "$RUNNER_TEMP/simulator-boot.log"
          exit "$simulator_boot_status"

      - name: Run logic tests
        run: |
          set -euo pipefail
          test -n "$SIMULATOR_ID" || { echo "The test simulator was not selected"; exit 1; }
          xcodebuild \
            -project PocketLedger.xcodeproj \
            -scheme PocketLedger \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -clonedSourcePackagesDirPath "$HOME/Library/Developer/Xcode/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            test-without-building \
            -only-testing:PocketLedgerTests 2>&1 | tee "$RUNNER_TEMP/xcodebuild-logic-tests.log"
