name: Build unsigned iOS IPAs

on:
  workflow_dispatch:
    inputs:
      run_simulator_tests:
        description: Run the iPhone Simulator test job (adds about 9 minutes)
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-package:
    name: Build two complete sideload IPAs
    needs: test-ios
    if: always() && (needs.test-ios.result == 'success' || needs.test-ios.result == 'skipped')
    runs-on: xcode-27

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache Swift package data
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/SourcePackages
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Print build environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          xcode-select -p

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build normal iPhone app and widget
        run: |
          set -o pipefail
          xcodebuild \
            -project PocketLedger.xcodeproj \
            -scheme PocketLedger \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/NormalDerivedData" \
            -clonedSourcePackagesDirPath "$HOME/Library/Developer/Xcode/SourcePackages" \
            POCKET_LEDGER_DEVELOPER_PRO_OVERRIDE=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-normal.log"

      - name: Build normal Apple Watch app and complication
        run: |
          set -o pipefail
          xcodebuild \
            -project PocketLedger.xcodeproj \
            -scheme PocketLedgerWatch \
            -configuration Release \
            -sdk watchos \
            -destination "generic/platform=watchOS" \
            -derivedDataPath "$RUNNER_TEMP/NormalWatchDerivedData" \
            -clonedSourcePackagesDirPath "$HOME/Library/Developer/Xcode/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-watch-normal.log"

      - name: Build sandbox iPhone app and widget
        run: |
          set -o pipefail
          xcodebuild \
            -project PocketLedger.xcodeproj \
            -scheme PocketLedger \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/SandboxDerivedData" \
            -clonedSourcePackagesDirPath "$HOME/Library/Developer/Xcode/SourcePackages" \
            POCKET_LEDGER_DEVELOPER_PRO_OVERRIDE=YES \
            POCKET_LEDGER_BUNDLE_ID_SUFFIX=.sandbox \
            POCKET_LEDGER_APP_GROUP_ID_SUFFIX=.sandbox \
            POCKET_LEDGER_DISPLAY_NAME="Pocket Ledger Sandbox" \
            POCKET_LEDGER_WIDGET_DISPLAY_NAME="Pocket Ledger Sandbox Balance" \
            POCKET_LEDGER_URL_SUFFIX=-sandbox \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-sandbox.log"

      - name: Build sandbox Apple Watch app and complication
        run: |
          set -o pipefail
          xcodebuild \
            -project PocketLedger.xcodeproj \
            -scheme PocketLedgerWatch \
            -configuration Release \
            -sdk watchos \
            -destination "generic/platform=watchOS" \
            -derivedDataPath "$RUNNER_TEMP/SandboxWatchDerivedData" \
            -clonedSourcePackagesDirPath "$HOME/Library/Developer/Xcode/SourcePackages" \
            POCKET_LEDGER_BUNDLE_ID_SUFFIX=.sandbox \
            POCKET_LEDGER_APP_GROUP_ID_SUFFIX=.sandbox \
            POCKET_LEDGER_WATCH_DISPLAY_NAME="Pocket Ledger Sandbox" \
            POCKET_LEDGER_WATCH_WIDGET_DISPLAY_NAME="Pocket Ledger Sandbox Complication" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-watch-sandbox.log"

      - name: Stage both app variants
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sideload/normal" "$RUNNER_TEMP/sideload/sandbox"
          ditto "$RUNNER_TEMP/NormalDerivedData/Build/Products/Release-iphoneos/PocketLedger.app" \
            "$RUNNER_TEMP/sideload/normal/PocketLedger.app"
          ditto "$RUNNER_TEMP/NormalWatchDerivedData/Build/Products/Release-watchos/PocketLedgerWatch.app" \
            "$RUNNER_TEMP/sideload/normal/PocketLedgerWatch.app"
          ditto "$RUNNER_TEMP/SandboxDerivedData/Build/Products/Release-iphoneos/PocketLedger.app" \
            "$RUNNER_TEMP/sideload/sandbox/PocketLedger.app"
          ditto "$RUNNER_TEMP/SandboxWatchDerivedData/Build/Products/Release-watchos/PocketLedgerWatch.app" \
            "$RUNNER_TEMP/sideload/sandbox/PocketLedgerWatch.app"

      - name: Package and verify the two iPhone, Watch, and widget IPAs
        run: |
          set -euo pipefail

          check_plist_value() {
            local plist="$1"
            local key="$2"
            local expected="$3"
            local actual
            actual=$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist")
            if [ "$actual" != "$expected" ]; then
              echo "Unexpected $key in $plist: $actual (expected $expected)"
              return 1
            fi
          }

          require_entry() {
            local entries="$1"
            local entry="$2"
            grep -Fxq "$entry" "$entries" || {
              echo "IPA is missing $entry"
              return 1
            }
          }

          package_ipa() {
            local variant="$1"
            local bundle_suffix="$2"
            local app_display_name="$3"
            local widget_display_name="$4"
            local watch_display_name="$5"
            local watch_widget_display_name="$6"
            local ipa_name="$7"
            local app_bundle_id="com.josephlteif.pocketledger$bundle_suffix"
            local app_group_id="group.com.josephlteif.pocketledger$bundle_suffix"
            local watch_bundle_id="$app_bundle_id.watchkitapp"
            local source_app="$RUNNER_TEMP/sideload/$variant/PocketLedger.app"
            local source_watch="$RUNNER_TEMP/sideload/$variant/PocketLedgerWatch.app"
            local package_root="$RUNNER_TEMP/package-$variant"
            local app_path="$package_root/Payload/PocketLedger.app"
            local watch_path="$app_path/PlugIns/PocketLedgerWatch.app"
            local ipa_path="$GITHUB_WORKSPACE/$ipa_name"
            local entries="$RUNNER_TEMP/$variant-ipa-entries.txt"
            local widget_path="$app_path/PlugIns/PocketLedgerWidget.appex"
            local watch_widget_path="$watch_path/PlugIns/PocketLedgerWatchWidget.appex"

            test -d "$source_app" || { echo "Missing $variant iPhone app"; return 1; }
            test -d "$source_watch" || { echo "Missing $variant Watch app"; return 1; }
            mkdir -p "$package_root/Payload"
            ditto "$source_app" "$app_path"
            mkdir -p "$app_path/PlugIns"
            ditto "$source_watch" "$watch_path"

            test -d "$widget_path" || { echo "Missing $variant iPhone widget"; return 1; }
            test -d "$watch_widget_path" || { echo "Missing $variant Watch widget"; return 1; }

            check_plist_value "$app_path/Info.plist" CFBundleIdentifier "$app_bundle_id"
            check_plist_value "$app_path/Info.plist" CFBundleDisplayName "$app_display_name"
            check_plist_value "$app_path/Info.plist" PocketLedgerDeveloperProOverrideEnabled YES
            check_plist_value "$app_path/Info.plist" PocketLedgerAppGroupIdentifier "$app_group_id"
            check_plist_value "$widget_path/Info.plist" CFBundleDisplayName "$widget_display_name"
            check_plist_value "$widget_path/Info.plist" CFBundleIdentifier "$app_bundle_id.widget"
            check_plist_value "$widget_path/Info.plist" PocketLedgerAppGroupIdentifier "$app_group_id"
            check_plist_value "$widget_path/Info.plist" NSExtension:NSExtensionPointIdentifier com.apple.widgetkit-extension
            check_plist_value "$watch_path/Info.plist" CFBundleDisplayName "$watch_display_name"
            check_plist_value "$watch_path/Info.plist" CFBundleIdentifier "$watch_bundle_id"
            check_plist_value "$watch_path/Info.plist" WKCompanionAppBundleIdentifier "$app_bundle_id"
            check_plist_value "$watch_path/Info.plist" PocketLedgerAppGroupIdentifier "$app_group_id"
            check_plist_value "$watch_widget_path/Info.plist" CFBundleDisplayName "$watch_widget_display_name"
            check_plist_value "$watch_widget_path/Info.plist" CFBundleIdentifier "$watch_bundle_id.widget"
            check_plist_value "$watch_widget_path/Info.plist" PocketLedgerAppGroupIdentifier "$app_group_id"
            check_plist_value "$watch_widget_path/Info.plist" NSExtension:NSExtensionPointIdentifier com.apple.widgetkit-extension

            for extension_plist in "$widget_path/Info.plist" "$watch_widget_path/Info.plist"; do
              if /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$extension_plist" >/dev/null 2>&1; then
                echo "Unexpected NSExtensionPrincipalClass in $extension_plist"
                return 1
              fi
            done

            ditto -c -k --sequesterRsrc --keepParent "$package_root/Payload" "$ipa_path"
            unzip -t "$ipa_path"
            unzip -Z1 "$ipa_path" > "$entries"
            require_entry "$entries" Payload/PocketLedger.app/PlugIns/PocketLedgerWidget.appex/Info.plist
            require_entry "$entries" Payload/PocketLedger.app/PlugIns/PocketLedgerWatch.app/Info.plist
            require_entry "$entries" Payload/PocketLedger.app/PlugIns/PocketLedgerWatch.app/PlugIns/PocketLedgerWatchWidget.appex/Info.plist
            if grep -Eq '^Payload/PocketLedger\.app/Watch/PocketLedgerWatch\.app(/|$)' "$entries"; then
              echo "The legacy Watch/ embedding path must not be packaged."
              return 1
            fi
            echo "Verified $ipa_name ($app_bundle_id; $watch_bundle_id; iPhone and Watch widgets)"
          }

          package_ipa normal "" "Pocket Ledger" "Pocket Ledger Balance" "Pocket Ledger" "Pocket Ledger Complication" "PocketLedger-unsigned.ipa"
          package_ipa sandbox ".sandbox" "Pocket Ledger Sandbox" "Pocket Ledger Sandbox Balance" "Pocket Ledger Sandbox" "Pocket Ledger Sandbox Complication" "PocketLedger-sandbox-iphone-sideload.ipa"

          test "$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name '*.ipa' -type f | wc -l | tr -d '[:space:]')" = "2"

      - name: Upload the two IPA files
        uses: actions/upload-artifact@v7
        with:
          name: PocketLedger-unsigned
          path: |
            PocketLedger-unsigned.ipa
            PocketLedger-sandbox-iphone-sideload.ipa
          if-no-files-found: error
          retention-days: 7
  test-ios:
    name: Run iOS tests
    runs-on: xcode-27
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_simulator_tests }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache Swift package data
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/SourcePackages
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Compile unit tests and boot an iPhone simulator
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && $2 ~ /^[A-Fa-f0-9-]+$/ { print $2; exit }')"
          test -n "$SIMULATOR_ID" || { echo "No available iPhone simulator found"; exit 1; }
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

          if ! xcrun simctl list devices available | grep -F "$SIMULATOR_ID" | grep -F "(Booted)" > /dev/null; then
            xcrun simctl boot "$SIMULATOR_ID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_ID" -b > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &
          simulator_boot_pid=$!

          build_status=0
          xcodebuild \
            -project PocketLedger.xcodeproj \
            -scheme PocketLedger \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -clonedSourcePackagesDirPath "$HOME/Library/Developer/Xcode/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/xcodebuild-tests.log" || build_status=$?

          if [ "$build_status" -ne 0 ]; then
            kill "$simulator_boot_pid" 2>/dev/null || true
            exit "$build_status"
          fi

          simulator_boot_status=0
          wait "$simulator_boot_pid" || simulator_boot_status=$?
          cat "$RUNNER_TEMP/simulator-boot.log"
          exit "$simulator_boot_status"

      - name: Run logic tests
        run: |
          set -euo pipefail
          test -n "$SIMULATOR_ID" || { echo "The test simulator was not selected"; exit 1; }
          xcodebuild \
            -project PocketLedger.xcodeproj \
            -scheme PocketLedger \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -clonedSourcePackagesDirPath "$HOME/Library/Developer/Xcode/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            test-without-building \
            -only-testing:PocketLedgerTests 2>&1 | tee "$RUNNER_TEMP/xcodebuild-logic-tests.log"
