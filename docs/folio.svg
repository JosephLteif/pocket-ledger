  <text x="130" y="222" fill="#5c675f" font-family="monospace" font-size="12" letter-spacing="2">DATE</text>
  <text x="220" y="222" fill="#5c675f" font-family="monospace" font-size="12" letter-spacing="2">DETAIL</text>
  <text x="369" y="222" fill="#17584d" font-family="monospace" font-size="12" letter-spacing="2">USD</text>
  <path d="M128 235h287M128 276h287M128 317h287M128 358h287M128 399h287M128 440h287M128 481h287" stroke="#c8c0ae" stroke-width="1"/>
  <path d="M198 207v275M348 207v275" stroke="#c8c0ae" stroke-width="1"/>
  <path d="M202 235v247" stroke="#b69148" stroke-width="2" opacity=".8"/>
