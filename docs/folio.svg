    <path d="m91 73 345-23 28 23v478l-25-18-350 23z" fill="url(#paperLines)"/>
    <path d="m464 73 351 10-20 473-351-18 20-18z" fill="url(#paperLines)"/>
  </g>
  <path d="M464 73v478" stroke="#b8ad98" stroke-width="3"/>
