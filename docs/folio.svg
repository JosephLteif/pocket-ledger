  <text x="710" y="222" fill="#17584d" font-family="monospace" font-size="12" letter-spacing="2">LBP</text>
  <path d="M500 235h278M500 276h278M500 317h278M500 358h278M500 399h278M500 440h278M500 481h278" stroke="#c8c0ae" stroke-width="1"/>
  <path d="M687 207v275" stroke="#c8c0ae" stroke-width="1"/>
