<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">An open Pocket Ledger</title>
  <desc id="desc">A hand-drawn ledger spread with separate dollar and lira columns, on warm paper.</desc>
  <defs>
    <pattern id="paperLines" width="1" height="39" patternUnits="userSpaceOnUse">
      <path d="M0 38.5H900" stroke="#c8c0ae" stroke-width="1" opacity=".65"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#26352e" flood-opacity=".16"/>
    </filter>
  </defs>
  <path d="M71 83 429 53l35 21 368 11-31 493-355 23-24-11-369 26z" fill="#1a2d28" opacity=".95"/>
