name: PocketLedger

options:
  bundleIdPrefix: com.josephlteif
  deploymentTarget:
    iOS: 26.0
    watchOS: 26.0
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
    WATCHOS_DEPLOYMENT_TARGET: 26.0
    SWIFT_VERSION: 6.0

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  PocketLedger:
    type: application
    platform: iOS
    sources:
      - path: PocketLedger/App
      - path: PocketLedger/Models
      - path: PocketLedger/Services
      - path: PocketLedger/Shared
      - path: PocketLedger/WatchShared
      - path: PocketLedger/Resources/Assets.xcassets
    resources:
      - path: PocketLedger/Config/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephlteif.financedemo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: PocketLedger/Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: PocketLedger/Config/PocketLedger.entitlements
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
    info:
      path: PocketLedger/Config/Info.plist
      properties:
        CFBundleDisplayName: Pocket Ledger
        CFBundleName: Pocket Ledger
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "Pocket Ledger uses the camera to read bill items."
        NSFaceIDUsageDescription: "Pocket Ledger uses Face ID to unlock your financial data."
        NSPhotoLibraryUsageDescription: "Pocket Ledger uses selected bill photos to read bill items."
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.josephlteif.pocketledger
            CFBundleURLSchemes:
              - pocketledger
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: PocketLedger/Config/PocketLedger.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.josephlteif.financedemo
    dependencies:
      - package: ZIPFoundation
      - target: PocketLedgerWidget
        embed: true
        codeSign: false
    scheme:
      gatherCoverageData: false
      testTargets:
        - PocketLedgerTests

  PocketLedgerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PocketLedger/Models
      - path: PocketLedger/Services/FinanceStorage.swift
      - path: PocketLedger/Shared
      - path: PocketLedger/WatchShared
      - path: PocketLedgerWidget
    resources:
      - path: PocketLedgerWidget/Config/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephlteif.financedemo.widget
        INFOPLIST_FILE: PocketLedgerWidget/Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: PocketLedgerWidget/Config/PocketLedgerWidget.entitlements
        TARGETED_DEVICE_FAMILY: 1
    info:
      path: PocketLedgerWidget/Config/Info.plist
      properties:
        CFBundleDisplayName: Pocket Ledger Balance
        CFBundleName: Pocket Ledger Widget
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PocketLedgerWidget/Config/PocketLedgerWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.josephlteif.financedemo

  PocketLedgerWatch:
    type: application
    platform: watchOS
    sources:
      - path: PocketLedger/Models/FinanceModel.swift
      - path: PocketLedger/WatchShared
      - path: PocketLedgerWatch
    resources:
      - path: PocketLedgerWatch/Config/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephlteif.financedemo.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTS_MACCATALYST: NO
    info:
      path: PocketLedgerWatch/Config/Info.plist
      properties:
        WKWatchKitApp: true
        CFBundleDisplayName: Pocket Ledger
        CFBundleName: Pocket Ledger
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKCompanionAppBundleIdentifier: com.josephlteif.financedemo
        WKRunsIndependentlyOfCompanionApp: false
    entitlements:
      path: PocketLedgerWatch/Config/PocketLedgerWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.josephlteif.financedemo
    dependencies:
      - target: PocketLedgerWatchWidget
        embed: true
        codeSign: false
    scheme: {}

  PocketLedgerWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: PocketLedger/Models/FinanceModel.swift
      - path: PocketLedger/WatchShared
      - path: PocketLedgerWatchWidget
    resources:
      - path: PocketLedgerWatchWidget/Config/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephlteif.financedemo.watchkitapp.widget
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: PocketLedgerWatchWidget/Config/Info.plist
      properties:
        CFBundleDisplayName: Pocket Ledger Complication
        CFBundleName: Pocket Ledger Complication
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PocketLedgerWatchWidget/Config/PocketLedgerWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.josephlteif.financedemo

  PocketLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PocketLedgerTests
    dependencies:
      - target: PocketLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephlteif.financedemo.tests
        GENERATE_INFOPLIST_FILE: YES
