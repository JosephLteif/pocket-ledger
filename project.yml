name: PocketLedger

options:
  bundleIdPrefix: com.josephlteif
  deploymentTarget:
    iOS: 26.0
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 1
    POCKET_LEDGER_BUNDLE_ID_BASE: com.josephlteif.pocketledger
    POCKET_LEDGER_BUNDLE_ID_SUFFIX: ""
    POCKET_LEDGER_APP_GROUP_ID_BASE: group.com.josephlteif.pocketledger
    POCKET_LEDGER_APP_GROUP_ID_SUFFIX: ""
    POCKET_LEDGER_DISPLAY_NAME: Pocket Ledger
    POCKET_LEDGER_URL_SCHEME: pocketledger
    POCKET_LEDGER_URL_SUFFIX: ""
    POCKET_LEDGER_DEVELOPER_PRO_OVERRIDE: "NO"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  PocketLedger:
    type: application
    platform: iOS
    sources:
      - path: PocketLedger/App
      - path: PocketLedger/Models
      - path: PocketLedger/Services
      - path: PocketLedger/Shared
      - path: PocketLedger/Resources/Assets.xcassets
    resources:
      - path: PocketLedger/Config/PrivacyInfo.xcprivacy
      - path: PocketLedger/Resources/Skills.skillsbundle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POCKET_LEDGER_BUNDLE_ID_BASE)$(POCKET_LEDGER_BUNDLE_ID_SUFFIX)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) POCKET_LEDGER_APP_TARGET"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: PocketLedger/Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: PocketLedger/Config/PocketLedger.entitlements
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
    info:
      path: PocketLedger/Config/Info.plist
      properties:
        CFBundleDisplayName: $(POCKET_LEDGER_DISPLAY_NAME)
        CFBundleName: $(POCKET_LEDGER_DISPLAY_NAME)
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "Pocket Ledger uses the camera to read bill items."
        NSFaceIDUsageDescription: "Pocket Ledger uses Face ID to unlock your financial data."
        NSPhotoLibraryUsageDescription: "Pocket Ledger uses selected bill photos to read bill items."
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.josephlteif.pocketledger.backup
            UTTypeDescription: Pocket Ledger Full Backup
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - pocketledger
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(POCKET_LEDGER_BUNDLE_ID_BASE)$(POCKET_LEDGER_BUNDLE_ID_SUFFIX)
            CFBundleURLSchemes:
              - $(POCKET_LEDGER_URL_SCHEME)$(POCKET_LEDGER_URL_SUFFIX)
        PocketLedgerAppGroupIdentifier: $(POCKET_LEDGER_APP_GROUP_ID_BASE)$(POCKET_LEDGER_APP_GROUP_ID_SUFFIX)
        PocketLedgerDeveloperProOverrideEnabled: $(POCKET_LEDGER_DEVELOPER_PRO_OVERRIDE)
        PocketLedgerURLScheme: $(POCKET_LEDGER_URL_SCHEME)$(POCKET_LEDGER_URL_SUFFIX)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: PocketLedger/Config/PocketLedger.entitlements
      properties:
        com.apple.security.application-groups:
          - $(POCKET_LEDGER_APP_GROUP_ID_BASE)$(POCKET_LEDGER_APP_GROUP_ID_SUFFIX)
    dependencies:
      - package: ZIPFoundation
    scheme:
      gatherCoverageData: false
      testTargets:
        - PocketLedgerTests
        - PocketLedgerUITests

  PocketLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PocketLedgerTests
    dependencies:
      - target: PocketLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephlteif.pocketledger.tests
        GENERATE_INFOPLIST_FILE: YES

  PocketLedgerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PocketLedgerUITests
    dependencies:
      - target: PocketLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephlteif.pocketledger.uitests
        TEST_TARGET_NAME: PocketLedger
